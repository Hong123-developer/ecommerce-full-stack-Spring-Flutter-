name: ecomerce_shop
description: "Premium E-Commerce Mobile App"
publish_to: 'none'

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/assets/images/app_icon.png"

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  go_router: ^18.1.1
  flutter_secure_storage: ^11.2.0
  cached_network_image: ^4.0.5
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  shimmer: ^4.0.0
  google_fonts: ^9.0.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/flags/khmer.png
    - assets/flags/english.png
    - assets/fonts/NotoSansKhmer-Regular.ttf
    - assets/fonts/NotoSansKhmer-Bold.ttf
