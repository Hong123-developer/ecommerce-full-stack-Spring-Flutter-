# NOTE: this file SHADOWS src/main/resources/application.properties during tests -
# test resources come first on the classpath, so the main file is not loaded at all.
# Anything the context needs to start must therefore be repeated here.

# ===================== In-memory database =====================
spring.datasource.url=jdbc:h2:mem:ecommerce_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===================== OAuth2 (dummy - no real calls in tests) =====================
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ===================== Mail =====================
# Host must be set or JavaMailSender is never auto-configured and injection fails.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=
spring.mail.password=

# ===================== Application =====================
app.jwt.secret=test-only-secret-key-that-is-definitely-32-bytes
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000
app.jwt.issuer=ecomercewepapp

app.otp.length=6
app.otp.expiration-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

app.oauth2.redirect-uri=http://localhost:5173/oauth2/callback

app.mail.from=no-reply@test.local
app.mail.app-name=Ecomerce Shop Online

app.cors.allowed-origins=http://localhost:5173

app.admin.email=admin@test.local
app.admin.password=Admin@12345
app.admin.full-name=Test Administrator

app.order.delivery-fee=1.50
app.order.number-prefix=ORD

app.bakong.api-url=http://localhost:9999
app.bakong.token=test-token
app.bakong.account-id=test@devb
app.bakong.merchant-name=Test Merchant
app.bakong.merchant-city=Phnom Penh
app.bakong.currency=USD
app.bakong.expiry-minutes=30

# Card payments stay off unless a test switches them on with its own merchant id and key.
app.payway.base-url=http://localhost:9998
app.payway.merchant-id=
app.payway.api-key=
app.payway.callback-url=
app.payway.frontend-url=http://localhost:5173
app.payway.lifetime-minutes=30

app.upload.dir=build/test-uploads
app.upload.max-image-size=5MB
