# ===================== PostgreSQL =====================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_ecomerce_wepapp
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================== JPA / Hibernate =====================
# 'update' lets Hibernate create/alter the tables from the @Entity classes on startup.
# Switch to 'validate' (plus Flyway migrations) before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Keeps the persistence context out of the view layer - no lazy loading in controllers.
spring.jpa.open-in-view=false 

# ===================== File upload =====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# ===================== Mail (SMTP) =====================
# Gmail needs an App Password, not your account password:
#   https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=prolmenghong8@gmail.com
spring.mail.password=tepbsshempapqewl
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===================== Application =====================
# HS256 needs at least 256 bits (32+ chars). Override in every real environment.
app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-at-least-32-bytes-long!!}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000
app.jwt.issuer=ecomercewepapp

app.otp.length=6
app.otp.expiration-minutes=10
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/callback}

app.mail.from=prolmenghong8@gmail.com
app.mail.app-name=Ecomerce Shop Online

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Seeded on first startup so you can log in as an administrator.
app.admin.email=${ADMIN_EMAIL:admin@ecomerceshopeonline.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.admin.full-name=System Administrator

# ===================== Orders =====================
app.order.delivery-fee=1.50
app.order.number-prefix=ORD

# ===================== Bakong KHQR =====================
# Real values live in ./config/application.properties, which is gitignored.
# Register for a token at https://api-bakong.nbc.gov.kh/register
app.bakong.api-url=${BAKONG_API_URL:https://api-bakong.nbc.gov.kh}
app.bakong.token=${BAKONG_TOKEN:}
app.bakong.account-id=${BAKONG_ACCOUNT_ID:}
app.bakong.merchant-name=${BAKONG_MERCHANT_NAME:Prol MengHong}
app.bakong.merchant-city=${BAKONG_MERCHANT_CITY:Phnom Penh}
app.bakong.currency=USD
app.bakong.expiry-minutes=30

# ===================== Card payments (ABA PayWay) =====================
# Card is hidden and refused until merchant-id AND api-key are set. Put the real values in
# ./config/application.properties (gitignored) or the environment - never commit them.
# S`andbox keys: https://sandbox.payway.com.kh/register-sandbox/  Live base URL: https://checkout.payway.com.kh
# callback-url: public https URL of POST /api/v1/payments/payway/callback (must be whitelisted
# by PayWay). Leave it blank on localhost - the payment page then confirms by polling.
#app.payway.base-url=${PAYWAY_BASE_URL:https://checkout-sandbox.payway.com.kh}
#app.payway.merchant-id=${PAYWAY_MERCHANT_ID:}
#app.payway.api-key=${PAYWAY_API_KEY:}
#app.payway.callback-url=${PAYWAY_CALLBACK_URL:}
#app.payway.frontend-url=${PAYWAY_FRONTEND_URL:http://localhost:5173}
#app.payway.lifetime-minutes=${PAYWAY_LIFETIME_MINUTES:30}`
# view-type: popup = PayWay's card form opens in a secure popup over the checkout (default);
# hosted_view = the old same-tab redirect to PayWay's page.
app.payway.view-type=${PAYWAY_VIEW_TYPE:popup}

# ===================== Image uploads =====================
# Relative paths resolve against the working directory. Served at /uploads/**.
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.max-image-size=5MB
